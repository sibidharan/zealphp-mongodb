<VirtualHost *:8089>
    ServerName parity.local
    DocumentRoot /repo/parity/public
    # PARITY_MONGODB_URI is forwarded from the container environment by
    # entrypoint.sh (PassEnv needs the var present in Apache's environment).
    PassEnv PARITY_MONGODB_URI
    <Directory /repo/parity/public>
        Require all granted
    </Directory>
</VirtualHost>
